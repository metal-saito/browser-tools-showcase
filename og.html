<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex, nofollow">
  <title>OG 画像生成用（1200×630）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* このページは og.png の撮影専用。常にライト配色で描画する（撮影結果を固定するため）。 */
    :root {
      --accent: #2563eb;
      --accent-tint: #eff6ff;
      --accent-soft: #dbeafe;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --surface: #ffffff;
      --ok-bg: #dcfce7;
      --ok-text: #166534;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #ffffff 0%, #f1f6ff 55%, #dbe8ff 100%);
    }
    .frame {
      position: relative;
      width: 1200px;
      height: 630px;
      display: grid;
      grid-template-columns: 55% 45%;
      padding: 64px 72px;
      gap: 24px;
      align-items: center;
    }
    /* 背景の装飾 */
    .frame::before {
      content: "";
      position: absolute;
      right: -120px;
      top: -140px;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.16) 0%, rgba(37, 99, 235, 0) 70%);
    }
    .frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      background: var(--accent);
    }

    .left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .tag svg { width: 22px; height: 22px; }
    h1 {
      margin: 0;
      font-size: 62px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .sub {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      font-size: 30px;
      font-weight: 500;
      color: var(--text-sub);
      line-height: 1.4;
    }
    .sub .term { white-space: nowrap; }
    .sub .sep {
      color: var(--text-muted);
      margin: 0 10px;
      font-weight: 400;
    }
    .small {
      margin: 6px 0 0;
      font-size: 22px;
      color: var(--text-sub);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: center;
    }
    .small span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .small span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* 右：結果カードのモック */
    .right {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .mock {
      width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05), 0 18px 48px rgba(37, 99, 235, 0.18);
      padding: 28px 30px 26px;
    }
    .mock .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .mock .head .t {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .mock .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 12px;
      border-radius: 999px;
      background: var(--ok-bg);
      color: var(--ok-text);
      font-size: 14px;
      font-weight: 700;
    }
    .mock .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .mock .total {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .mock .total .l {
      font-size: 17px;
      color: var(--text-sub);
    }
    .mock .total .v {
      font-size: 48px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .mock .bd {
      font-size: 15px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .mock ul {
      list-style: none;
      margin: 16px 0 0;
      padding: 14px 0 0;
      border-top: 1px dashed var(--border);
      font-size: 17px;
      display: grid;
      gap: 8px;
    }
    .mock li {
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
    }
    .mock .btn {
      margin-top: 18px;
      height: 46px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="left">
      <span class="tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="14" rx="2"></rect>
          <path d="M3 9h18M8 21h8"></path>
        </svg>
        業務ツール制作
      </span>
      <h1>ブラウザで動く<br>業務ツール制作</h1>
      <p class="sub"><span class="term">見積シミュレーター</span><span class="sep">/</span><span class="term">CSV 集計</span><span class="sep">/</span><span class="term">ダッシュボード</span></p>
      <p class="small">
        <span>インストール不要</span>
        <span>月額 0 円</span>
        <span>Claude Code で短納期</span>
      </p>
    </div>

    <div class="right">
      <div class="mock" aria-hidden="true">
        <div class="head">
          <span class="t">概算結果</span>
          <span class="badge">即時計算</span>
        </div>
        <div class="total"><span class="l">税込</span><span class="v">¥73,700</span></div>
        <div class="bd">税抜 ¥67,000 ／ 消費税 ¥6,700</div>
        <ul>
          <li><span>間取り：1LDK</span><span>¥28,000</span></li>
          <li><span>エアコン 2台</span><span>¥24,000</span></li>
          <li><span>キッチン</span><span>¥15,000</span></li>
        </ul>
        <div class="btn">この内容で問い合わせる</div>
      </div>
    </div>
  </div>
</body>
</html>
